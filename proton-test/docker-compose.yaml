version: "3"
services:
  gluetun:
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 9091:9091
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=QItu+OAwqAa9+BDRD0inpNk5wY62xhtWInCXUQGtm2U=
      - SERVER_COUNTRIES=Luxembourg,Belgium
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
  transmission:
    image: linuxserver/transmission
    network_mode: service:gluetun
    environment:
      - "PASSWORD=w4sh1ngt0nDC"
      - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      - "PEER_PORT=51413"
      - "RPC_PORT=9091"
      - "UID=1000"
      - "USERNAME=iben"
      - "GID=1000"
    volumes:
      - /share/Public/Downloads:/downloads
      - /share/Public/Videos:/videos
      - /share/CACHEDEV1_DATA/Container/container-station-data/lib/docker/volumes/a702a1a2c5bc824acac6cc27ebfd44236c912d93a9e1d87d5c5c05b7bfeabd74/_data:/data
    depends_on:
      gluetun:
        condition: service_healthy
